"""Exposes a URL that specifies the behaviour of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behaviour of this scalar."""
  url: String!
) on SCALAR

"""Indicates an Input Object is a OneOf Input Object."""
directive @oneOf on INPUT_OBJECT

type ClientFilterInfo {
  id: String
  label: String
  uuids: String
}

type ClientInfo {
  baseCurrency: String
  file: String
  id: String
  label: String
}

type DeltaPoint {
  date: String
  value: MoneyInfo
}

type KeyValueEntry {
  key: String
  value: String
}

input KeyValueInputInput {
  key: String
  value: String
}

"""A 64-bit signed integer"""
scalar Long

type MoneyInfo {
  amount: Float!
  currencyCode: String
}

"""Mutation root"""
type Mutation {
  updateUserReactUIPreferences(entries: [KeyValueInputInput], clientId: String): [KeyValueEntry]
  createSecurity(calendar: String, note: String, feedURL: String, clientId: String, latestFeedURL: String, tickerSymbol: String, latestFeed: String, targetCurrencyCode: String, feed: String, onlineId: String, name: String, attributes: [SecurityAttributeInputInput], retired: Boolean, wkn: String, currencyCode: String, isin: String): SecurityInfo
  updateQuotes(clientId: String, scope: UpdateQuotesScope): UpdateQuotesResult
  updateSecurity(calendar: String, note: String, feedURL: String, clientId: String, latestFeedURL: String, tickerSymbol: String, securityId: String, latestFeed: String, targetCurrencyCode: String, feed: String, onlineId: String, name: String, attributes: [SecurityAttributeInputInput], retired: Boolean, wkn: String, currencyCode: String, isin: String): SecurityInfo
}

type PerformancePortfolioInfo {
  delta: MoneyInfo
  deltaPercent: Float!
  portfolioId: String
  portfolioName: String
  referenceAccountId: String
  referenceAccountName: String
  startValue: MoneyInfo
}

type PerformanceReferenceAccountInfo {
  accountId: String
  accountName: String
  delta: MoneyInfo
  deltaPercent: Float!
  linkedPortfolioId: String
  startValue: MoneyInfo
  taxonomyAssignments: [PerformanceTaxonomyAssignmentInfo]
}

type PerformanceSecurityInfo {
  delta: MoneyInfo
  deltaPercent: Float!
  id: String
  name: String
  portfolioId: String
  securityId: String
  startValue: MoneyInfo
  taxonomyAssignments: [PerformanceTaxonomyAssignmentInfo]
}

type PerformanceTaxonomyAssignmentInfo {
  classificationId: String
  classificationName: String
  taxonomyId: String
  taxonomyName: String
}

type PerformanceTaxonomyClassificationInfo {
  classificationId: String
  delta: MoneyInfo
  deltaPercent: Float!
  name: String
  parentId: String
  startValue: MoneyInfo
}

type PerformanceTaxonomyInfo {
  classifications: [PerformanceTaxonomyClassificationInfo]
  taxonomyId: String
  taxonomyName: String
}

type PerformanceTotalInfo {
  delta: MoneyInfo
  deltaPercent: Float!
  startValue: MoneyInfo
}

type PortfolioSecurityPerformanceResult {
  portfolios: [PerformancePortfolioInfo]
  referenceAccounts: [PerformanceReferenceAccountInfo]
  securities: [PerformanceSecurityInfo]
  taxonomies: [PerformanceTaxonomyInfo]
  total: PerformanceTotalInfo
}

"""Query root"""
type Query {
  clientFilterAccumulatedDelta(filterId: String, portfolioId: String, clientId: String, endDate: String, referenceAccountId: String, securityId: String, classificationId: String, startDate: String): [DeltaPoint]
  securityAttributes(clientId: String): [SecurityAttributeTypeInfo]
  clients: [ClientInfo]
  clientFilterDelta(filterId: String, clientId: String, endDate: String, startDate: String): MoneyInfo
  portfolioSecurityPerformance(filterId: String, clientId: String, endDate: String, startDate: String): PortfolioSecurityPerformanceResult
  userReactUIPreferences(clientId: String): [KeyValueEntry]
  reportingPeriods(clientId: String, referenceDate: String): [ReportingPeriodInfo]
  clientFilters(clientId: String): [ClientFilterInfo]
  securityQuotes(clientId: String, endDate: String, securityId: String, startDate: String): [SecurityQuoteInfo]
  securities(clientId: String): [SecurityInfo]
}

type QuoteUpdateProgress {
  completedTaskCount: Int!
  taskCount: Int!
  timestamp: Long!
}

type ReportingPeriodInfo {
  code: String
  endDate: String
  label: String
  startDate: String
}

type SecurityAttributeInfo {
  id: String
  name: String
  value: String
}

input SecurityAttributeInputInput {
  id: String
  value: String
}

type SecurityAttributeTypeInfo {
  id: String
  name: String
}

type SecurityInfo {
  attributes: [SecurityAttributeInfo]
  calendar: String
  currencyCode: String
  feed: String
  feedURL: String
  id: String
  isin: String
  latestFeed: String
  latestFeedURL: String
  name: String
  note: String
  onlineId: String
  retired: Boolean!
  targetCurrencyCode: String
  tickerSymbol: String
  wkn: String
}

type SecurityQuoteInfo {
  currencyCode: String
  date: String
  value: Float!
}

"""Subscription root"""
type Subscription {
  quoteUpdates(clientId: String): QuoteUpdateProgress
}

type UpdateQuotesResult {
  scheduled: Boolean!
  securityCount: Int!
}

enum UpdateQuotesScope {
  ACTIVE
  ALL
  HOLDINGS
}

